version: 2.1

jobs:
  build-test:
    docker:
      - image: cimg/node:lts

    steps:
      - checkout

      # Récupère les dépendances déjà téléchargées lors d'un précédent passage
      - restore_cache:
          keys:
            - v1-dependencies-{{ checksum "package-lock.json" }}
            - v1-dependencies-

      - run:
          name: Installer les dépendances
          command: npm install

      - save_cache:
          paths:
            - node_modules
          key: v1-dependencies-{{ checksum "package-lock.json" }}

      - run:
          name: Lancer les tests
          command: npm run test

      - run:
          name: Builder l'application
          command: npm run build

workflows:
  node-tests:
    jobs:
      - build-test